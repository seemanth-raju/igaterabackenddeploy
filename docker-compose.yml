services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-igatera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-igatera_pass}
      POSTGRES_DB: ${POSTGRES_DB:-igatera_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./files/sql_file/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-igatera} -d ${POSTGRES_DB:-igatera_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-igatera}:${POSTGRES_PASSWORD:-igatera_pass}@db:5432/${POSTGRES_DB:-igatera_db}
    volumes:
      - fingerprint_storage:/app/storage/fingerprints
    depends_on:
      db:
        condition: service_healthy

  extractor:
    build: ./streamlit_extractor
    restart: unless-stopped
    network_mode: host
    # network_mode: host uses the host's network stack directly so the Matrix
    # device sees the server's real LAN IP instead of the Docker bridge IP.
    # Port mapping is not used with host networking — the Flask server binds
    # directly to port 5000 (or EXTRACTOR_PORT) on the host.

volumes:
  postgres_data:
  fingerprint_storage:
