services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - fingerprint_storage:/app/storage/fingerprints

  extractor:
    build: ./streamlit_extractor
    restart: unless-stopped
    ports:
      - "${EXTRACTOR_PORT:-5000}:5000"

volumes:
  fingerprint_storage:
