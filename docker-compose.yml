services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - fingerprint_storage:/app/storage/fingerprints

  extractor:
    build: ./streamlit_extractor
    restart: unless-stopped
    network_mode: host
    # network_mode: host uses the host's network stack directly so the Matrix
    # device sees the server's real LAN IP instead of the Docker bridge IP.
    # Port mapping is not used with host networking — the Flask server binds
    # directly to port 5000 (or EXTRACTOR_PORT) on the host.

volumes:
  fingerprint_storage:
